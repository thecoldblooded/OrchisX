[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchisx-scraper"
version = "1.0.0"
description = "Self-hosted High-Performance Twitter & Web Scraping Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scrapling>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "httpx[http2]>=0.27.0",
    "apscheduler>=3.10.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "greenlet>=3.1.0",
    "curl_cffi>=0.7.0",
    "playwright>=1.48.0",
    "patchright>=1.48.0",
    "browserforge>=1.2.0",
    "mcp>=1.0.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
orchis = "cli.main:app"
orchisx = "cli.main:app"
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "pool*", "scraper*", "engine*", "api*", "mcp*", "cli*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
